<!DOCTYPE html>
<html>
    <head>
        <title>little lemon</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="text-center">
                        <img src="logo.png" class="img-fluid" alt="little lemon logo">
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col">
                     <h1>our menu</h1>
                     <div class="row">
                            <div class="col-12 col-lg-6">
                                <div class="card">
                                    <img src="falafel.jpg" class="img-fluid" alt="falafel">
                                    <div class="cardbody">
                                        <div class="cardtitle">
                                            <h2>Falafel</h2>
                                        </div> 
                                        <div class="cardrext">
                                            <p>Chickpea, herbs, spices.</p>
                                        </div>                                         
                                    </div>                                
                                </div>
                            </div>
                             <div class="col-12 col-lg-6">
                                <div class="card">
                                    <img src="salad.jpg" class="img-fluid" alt="Pasta"> 
                                    <div class="cardbody">
                                        <div class="cardtitle">
                                            <h2>Pasta Salad</h2>
                                        </div>
                                        <div class="cardrext">
                                             <p>Lettuce, vegetables, mozzarella</p>
                                        </div>                                       
                                    </div>
                                </div>
                            </div>
                              <div class="col-12 col-lg-6">
                                <div class="card"> 
                                    <img src="calamari.jpg" class="img-fluid" alt="calamari">
                                    <div class="cardbody">
                                        <div class="cardtitle">
                                            <h2>Fried Calamari <span class="badge bg-warning" >New</span></h2>
                                        </div>
                                        <div class="cardrext">
                                            <p>Squid, buttermilk</p>
                                        </div> 
                                    </div>
                                </div>
                            </div>
                        </div>
                </div>
                <div class="col">
                    <h2>prices</h2>
                    <table>
                        <tr>
                            <td>falafel</td>
                            <td>$12.00</td>
                        </tr>
                        <tr>
                            <td>Pasta salad</td>
                            <td>$15.00</td>
                        </tr>
                        <tr>
                            <td>calamari</td>
                            <td>$12.00</td>
                        </tr>
                    </table>
                    <div class="alert alert-info" role="alert" >try our new fried calamari</div>
                </div>                                 
            </div>
        </div>
    </body>
</html>
